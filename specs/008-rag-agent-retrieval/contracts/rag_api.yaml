openapi: 3.0.0
info:
  title: RAG Agent API
  version: 1.0.0
  description: API for the Retrieval Augmented Generation (RAG) agent to process user queries and provide grounded answers.

paths:
  /query:
    post:
      summary: Submit a user query to the RAG agent
      operationId: submitQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The natural language query from the user.
                  example: "What is the main theme of 'Pride and Prejudice'?"
      responses:
        '200':
          description: Successful response from the RAG agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    description: The answer generated by the RAG agent, grounded in the retrieved context.
                    example: "The main theme of 'Pride and Prejudice' is the complexities of manners, upbringing, morality, social class, and marriage in the British Regency period."
                  sources:
                    type: array
                    description: A list of identifiers or references to the source documents/chunks used to generate the answer.
                    items:
                      type: string
                      example: "book_id:pride_prejudice_chunk_id:123"
        '400':
          description: Invalid request, e.g., missing query parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Query parameter is required."
        '500':
          description: Internal server error, e.g., Qdrant or embedding service failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "An internal error occurred while processing your request."
